---
all:
  children:
    routers:
      hosts:
        R-SUC-01:
          ansible_host: 192.168.99.1
    switches:
      hosts:
        SW-SUC-01-CORE:
          ansible_host: 192.168.99.2
        SW-SUC-01-ACC1:
          ansible_host: 192.168.99.3
  vars:
    ansible_connection: ansible.netcommon.network_cli
    ansible_network_os: cisco.ios.ios
    ansible_user: admin
    # La contrasena NO se guarda en el repositorio: se lee de variables de entorno
    ansible_password: "{{ lookup('env', 'ANSIBLE_NET_PASSWORD') }}"
    ansible_become: true
    ansible_become_method: enable
    ansible_become_password: "{{ lookup('env', 'ANSIBLE_NET_PASSWORD') }}"
